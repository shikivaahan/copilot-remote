[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-remote-backend"
version = "0.1.0"
description = "Self-hosted terminal transport - drive GitHub Copilot CLI from a phone."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Copilot Remote owner" }]
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.34",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlmodel>=0.0.22,<0.1",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt<4.1",
    "itsdangerous>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "ptyprocess>=0.7,<1.0",
    "python-multipart>=0.0.12,<1.0",
    "httpx>=0.27,<1.0",
    "websockets>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-httpx>=0.34,<1.0",
]

[project.scripts]
copilot-remote = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
